[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-notebook"
dynamic = ["version"]
description = "Self-hosted organic chemistry lab notebook backed by PubChem Local"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.5",
    "weasyprint>=61",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lab-notebook = "labnotebook.__main__:main"

[tool.setuptools]
packages = ["labnotebook"]

[tool.setuptools.dynamic]
version = { attr = "labnotebook.__version__" }

[tool.setuptools.package-data]
labnotebook = ["static/*", "static/js/*", "static/fonts/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
